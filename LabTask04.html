<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Task 4</title>
</head>

<body>
    <header>
        <h1>Student Information Form</h1>
    </header>
    <hr>
    <nav>
        <ul>
            <li><a href="https://www.aiub.edu/">AIUB Homepage</a></li>
            <li><a href="https://github.com/AhmadZubayer/WebTech_S-Labworks">GitHub</a></li>
        </ul>
    </nav>
    <hr>
        
   <main>
        <form action="#" method="post">
            
            <fieldset>
                <legend><strong>STUDENT INFORMATION</strong></legend>
                <br><br>
                
                <label for="full_name">Full Name:</label>
                <input type="text" id="full_name" name="full_name"> <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"> <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"> <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob"> <br><br>

                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </fieldset>

            <br>

            <fieldset>
                <legend><strong>ACADEMIC INFORMATION</strong></legend>
                <br><br>

                <label for="dept">Department:</label>
                <select id="dept" name="dept">
                    <option value="cs">CSE</option>
                    <option value="eee">EEE</option>
                    <option value="bba">BBA</option>
                </select> <br><br>

                <label>Skills:</label> <br>
                <input type="checkbox" id="html" name="skills" value="html">
                <label for="html">HTML</label> <br>
                <input type="checkbox" id="css" name="skills" value="css">
                <label for="css">CSS</label> <br>
                <input type="checkbox" id="js" name="skills" value="js">
                <label for="js">JavaScript</label>
            </fieldset>

            <br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </main>

    <hr>
    <footer>
        <p> 2026 Copyright, All Rights Reserved. <br>
            Developed by Ahmad Zubayer [23-54734-3]</p>
    </footer>

</body>

</html>
